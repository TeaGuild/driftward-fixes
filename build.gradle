plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.12'
group = 'ink.astrius'
base { archivesName = 'driftward-fixes' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.createmod.net" }
        }
        filter {
            includeGroup("com.simibubi.create")
            includeGroup("net.createmod.ponder")
            includeGroup("dev.engine-room.flywheel")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.ithundxr.dev/snapshots" }
        }
        filter {
            includeGroup("com.tterrag.registrate")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        }
        filter {
            includeGroup("fuzs.forgeconfigapiport")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.ryanhcode.dev/releases" }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.eriksonn.aeronautics")
            includeGroup("dev.simulated_team.simulated")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.blamejared.com/" }
        }
        filter {
            includeGroup("foundry.veil")
            includeGroup("gg.moonflower")
            includeGroup("io.github.ocelot")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://jitpack.io" }
        }
        filter {
            includeGroup("com.github.TheDeathlyCow")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.sinytra.org" }
        }
        filter {
            includeGroup("org.sinytra")
            includeGroup("org.sinytra.forgified-fabric-api")
        }
    }
}

neoForge {
    version = '21.1.233'
    mods {
        driftwardfixes { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation("maven.modrinth:critters-and-companions:kGomvo87")  // 2.6.2
    implementation("maven.modrinth:supplementaries:1.21.1-3.8.5")
    implementation("maven.modrinth:farmers-delight:1.21.1-1.3.2")
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    implementation("dev.eriksonn.aeronautics:aeronautics-common-1.21.1:1.3.0")
    implementation("maven.modrinth:thirst-was-reclaimed:1.21.1-3.0.4")
    implementation("dev.ryanhcode.sable:sable-common-1.21.1:2.0.3")
    implementation("com.github.TheDeathlyCow:thermoo:v4.8.1-neoforge")
    // tgbridge's NeoForge build, vendored for the StyledChat chat relay. compileOnly: the relay
    // calls tgbridge's documented public API (TelegramBridge#onChatMessage) against the real
    // shaded types, so it must be the neoforge jar (adventure is relocated to tgbridge.shaded.*),
    // not the maven `dev.vanutp.tgbridge:common` artifact whose net.kyori types wouldn't link.
    compileOnly files('libs/tgbridge.jar')
}
