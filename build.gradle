plugins {
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.16'
group = 'ink.astrius'
base { archivesName = 'driftward-fixes' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.createmod.net" }
        }
        filter {
            includeGroup("com.simibubi.create")
            includeGroup("net.createmod.ponder")
            includeGroup("dev.engine-room.flywheel")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.ithundxr.dev/snapshots" }
        }
        filter {
            includeGroup("com.tterrag.registrate")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        }
        filter {
            includeGroup("fuzs.forgeconfigapiport")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.ryanhcode.dev/releases" }
        }
        filter {
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
            includeGroup("dev.eriksonn.aeronautics")
            includeGroup("dev.simulated_team.simulated")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.blamejared.com/" }
        }
        filter {
            includeGroup("foundry.veil")
            includeGroup("gg.moonflower")
            includeGroup("io.github.ocelot")
            includeGroup("mezz.jei")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://jitpack.io" }
        }
        filter {
            includeGroup("com.github.TheDeathlyCow")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.sinytra.org" }
        }
        filter {
            includeGroup("org.sinytra")
            includeGroup("org.sinytra.forgified-fabric-api")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.theillusivec4.top" }
        }
        filter {
            includeGroup("top.theillusivec4.curios")
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = "https://maven.squiddev.cc" }
        }
        filter {
            includeGroup("cc.tweaked")
        }
    }
}

neoForge {
    version = '21.1.247'
    mods {
        driftwardfixes { sourceSet sourceSets.main }
    }
    parchment {
        minecraftVersion = "1.21.1"
        mappingsVersion = "2024.11.17"
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
        }
    }
}

dependencies {
    implementation("maven.modrinth:critters-and-companions:kGomvo87")  // 2.6.2
    implementation("maven.modrinth:supplementaries:1.21.1-3.8.5")
    implementation("maven.modrinth:farmers-delight:1.21.1-1.3.2")
    implementation("com.simibubi.create:create-1.21.1:6.0.10-280:slim") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+67")
    implementation("dev.eriksonn.aeronautics:aeronautics-neoforge-1.21.1:1.3.0")
    implementation("dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.3")
    implementation("dev.simulated_team.simulated:simulated-neoforge-1.21.1:1.3.0")
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:19.43.0.392")
    implementation("maven.modrinth:thirst-was-reclaimed:1.21.1-3.0.4")
    implementation("com.github.TheDeathlyCow:thermoo:v4.8.1-neoforge")
    runtimeOnly("maven.modrinth:moonlight:CitoQHqE")
    runtimeOnly("maven.modrinth:yacl:3.8.2+1.21.1-neoforge")
    runtimeOnly("maven.modrinth:geckolib:tPkJmim6")  // 4.9.2
    runtimeOnly("maven.modrinth:architectury-api:13.0.11+neoforge")
}

processResources {
    var expandProps = [
            "version": version,
    ]
    inputs.properties(expandProps)
    filesMatching("META-INF/neoforge.mods.toml") {
        expand expandProps
    }
}
